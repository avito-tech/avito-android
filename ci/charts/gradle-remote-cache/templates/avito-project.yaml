---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: gradle-remote-cache
    namespace: gradle-remote-cache
    labels:
        app: gradle-remote-cache
        service: gradle-remote-cache
spec:
    selector:
        matchLabels:
            app: gradle-remote-cache
            service: gradle-remote-cache
    replicas: 1
    template:
        metadata:
            labels:
                app: gradle-remote-cache
                service: gradle-remote-cache
                gradle-remote-cache-node: "true"
        spec:
            volumes:
                -   name: node-config
                    emptyDir: { }
            initContainers:
                -   name: create-config
                    image: busybox:1.33.1
                    # Scheme: https://docs.gradle.com/build-cache-node/schema/build-cache-node-config-schema-2.json
                    # targetSize (MiB) = unique writes per week x retention window (weeks) x ~1.5 headroom
                    # unique writes = daily growth of artifacts-v2 on a live node (sum file sizes by mtime day);
                    # retention window = PR lifetime / interval between key-invalidating toolchain bumps (2-4 weeks)
                    command:
                        - sh
                        - -c
                        - |
                            mkdir -p /data/conf
                            cat > /data/conf/config.yaml << 'EOF'
                            version: 2
                            cache:
                              targetSize: 500000
                              maxArtifactSize: 200
                              credentials:
                                anonymousLevel: "READWRITE"
                                users: []
                            EOF
                    volumeMounts:
                        -   name: node-config
                            mountPath: /data
            containers:
                -   name: gradle-remote-cache
                    image: "{{ .Values.docker.registry }}/{{ .Values.docker.image }}:{{ .Values.docker.image_tag}}"
                    imagePullPolicy: IfNotPresent
                    resources:
                        requests:
                            memory: 6Gi
                            cpu: 1000m
                            # ephemeral-storage = targetSize x (1 + perEntryOverhead / avgArtifactSize) + ~5 GiB slack
                            # perEntryOverhead = db.mv.db size / entry count (0.5-3.5 KiB) + ~2 KiB fs block rounding
                            # avgArtifactSize = artifacts-v2 size / entry count (measure on a similar live node)
                            # slack covers db compaction transient (~db size) + in-flight uploads
                            ephemeral-storage: 520Gi
                        limits:
                            memory: 12Gi
                            cpu: 2000m
                    ports:
                        -   containerPort: 5071
                    env:
                        -   name: JAVA_OPTS
                            value: "-Xms3g -Xmx10g -XX:MaxDirectMemorySize=1g"
                    volumeMounts:
                        -   name: node-config
                            mountPath: /data
            affinity:
                podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                        -   weight: 100
                            podAffinityTerm:
                                labelSelector:
                                    matchLabels:
                                        gradle-remote-cache-node: "true"
                                topologyKey: kubernetes.io/hostname
            tolerations:
                -   key: pool
                    operator: Equal
                    value: default
                    effect: NoSchedule
---
kind: Service
apiVersion: v1
metadata:
    name: gradle-remote-cache
    namespace: gradle-remote-cache
    labels:
        name: gradle-remote-cache
        service: gradle-remote-cache
spec:
    selector:
        app: gradle-remote-cache
    ports:
        -   protocol: TCP
            port: 80
            targetPort: 5071
---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
    name: gradle-remote-cache
    namespace: gradle-remote-cache
    annotations:
        kubernetes.io/ingress.class: service
        ingress.kubernetes.io/proxy-body-size: 200m
        nginx.ingress.kubernetes.io/proxy-body-size: 200m
        nginx.org/client-max-body-size: 200m
spec:
    rules:
        -   host: {{ .Values.hosts.avito_cache_url }}
            http:
                paths:
                    -   path: "/"
                        pathType: Prefix
                        backend:
                            service:
                                name: gradle-remote-cache
                                port:
                                    number: 80
